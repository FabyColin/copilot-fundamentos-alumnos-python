name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r src/requirements.txt -r requirements.txt
      - name: Pruebas de la app base
        run: pytest src
      - name: Compilar documentación
        run: mkdocs build --strict
